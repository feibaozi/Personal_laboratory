[package]
name = "codebase-engine"
version = "0.1.0"
edition = "2021"
description = "Core analysis engine for the Codebase Agent - AST parsing, dependency graphs, and code metrics"

[lib]
name = "codebase_engine"
crate-type = ["cdylib", "rlib"]

[dependencies]
tree-sitter = "0.25"
tree-sitter-python = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.25"
petgraph = { version = "0.6", features = ["serde-1"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.9"
walkdir = "2.4"
ignore = "0.4"
sha2 = "0.10"
log = "0.4"
thiserror = "1.0"
uuid = { version = "1.0", features = ["v4"] }
napi = { version = "2", features = ["full"] }
napi-derive = "2"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = false
opt-level = 3