name: foodie_comparison
description: 外卖比价优惠券小程序
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # 状态管理
  provider: ^6.1.2

  # 网络请求
  dio: ^5.4.0

  # 路由
  go_router: ^14.0.0

  # 本地存储
  shared_preferences: ^2.2.0

  # UI 增强
  shimmer: ^3.0.0
  cached_network_image: ^3.3.0

  # 工具
  intl: ^0.19.0
  logger: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  mockito: ^5.4.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true