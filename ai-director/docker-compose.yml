version: '3.8'

services:
  ai-director:
    build: .
    ports:
      - "8788:8788"
    volumes:
      - ai-director-data:/app/data
      - ai-director-output:/app/output
    env_file:
      - .env
    environment:
      - AI_DIRECTOR_DEBUG=false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8788/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  ai-director-data:
  ai-director-output:
