appId: com.mood-radio.widget
productName: Mood Radio
directories:
  output: release
files:
  - dist-electron/**/*
  - out/**/*
  - package.json
  - node_modules/**/*
  - "!node_modules/.cache/**"
win:
  target: nsis
  icon: public/favicon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target: dmg
  icon: public/favicon.icns
linux:
  target: AppImage