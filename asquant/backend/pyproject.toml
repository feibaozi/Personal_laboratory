[project]
name = "asquant-backend"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "akshare>=1.13",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.12",
    "apscheduler>=3.10",
    "pydantic>=2.6",
    "pydantic-settings>=2.1",
    "jinja2>=3.1",
    "weasyprint>=60",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
